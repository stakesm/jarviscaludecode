name: Build Windows Installer

# Builds a native Windows .msi/.exe installer on a real Windows runner
# (no cross-compilation) and uploads it as a workflow run artifact.
# This intentionally does NOT create a GitHub Release - grab the build
# from this workflow run's "Artifacts" section instead.
#
# Run it manually: Actions tab -> "Build Windows Installer" -> "Run workflow".

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundled AI models
        shell: pwsh
        # resources/models/** is gitignored (the .onnx weights are ~90-235MB,
        # well over GitHub's 100MB per-file limit) so the repo only carries
        # Git-LFS-style pointer stubs for them. Without this step those
        # ~130-byte stub files get bundled as-is and jarvis-app tries to load
        # them as real ONNX models at startup - every user hits an instant,
        # unexplained crash on first launch. Fetch the real weights (verified
        # by sha256 against what the pointer files reference) before the
        # Tauri bundler picks up resources/models/.
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            @{ Url = "https://huggingface.co/Qdrant/all-MiniLM-L6-v2-onnx/resolve/main/model.onnx"
               Dest = "resources/models/all-MiniLM-L6-v2/model.onnx"
               Sha256 = "BBD7B466F6D58E646FDC2BD5FD67B2F5E93C0B687011BD4548C420F7BD46F0C5" },
            @{ Url = "https://huggingface.co/Qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/resolve/main/model_optimized.onnx"
               Dest = "resources/models/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/model.onnx"
               Sha256 = "634D0F66C29DC934C8FA72B8A4FE91DD4D420A22F1D82A241058D4316E659A99" },
            @{ Url = "https://huggingface.co/Qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/resolve/main/tokenizer.json"
               Dest = "resources/models/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/tokenizer.json"
               Sha256 = "FA685FC160BBDBAB64058D4FC91B60E62D207E8DC60B9AF5C002C5AB946DED00" },
            @{ Url = "https://huggingface.co/Qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/resolve/main/unigram.json"
               Dest = "resources/models/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q/unigram.json"
               Sha256 = "DA145B5E7700AE40F16691EC32A0B1FDC1EE3298DB22A31EA55F57A966C4A65D" }
          )
          foreach ($f in $files) {
            Write-Host "Downloading $($f.Dest) ..."
            Invoke-WebRequest -Uri $f.Url -OutFile $f.Dest
            $actual = (Get-FileHash -Path $f.Dest -Algorithm SHA256).Hash
            if ($actual -ne $f.Sha256) {
              throw "Checksum mismatch for $($f.Dest): expected $($f.Sha256), got $actual"
            }
          }

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Pre-generate Routify routes
        working-directory: frontend
        # `npm run build` runs svelte-check before vite build, but the
        # generated .routify/routes.default.js (imported by App.svelte)
        # is normally only produced as a side effect of vite build itself.
        # On a fresh checkout it doesn't exist yet, so svelte-check fails
        # with "Cannot find module '../.routify/routes.default.js'".
        # Generate it explicitly first so svelte-check can resolve it.
        run: npx routify build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build jarvis-app and stage it as a Tauri sidecar
        shell: pwsh
        # jarvis-gui (the window you see) only launches the actual
        # assistant engine (jarvis-app) as a separate process - but Tauri's
        # bundler only packages the jarvis-gui binary itself. Without this,
        # the installed app has no jarvis-app.exe to launch at all and the
        # "Start" button silently does nothing. Build it explicitly and
        # place it where tauri.conf.json's "externalBin" expects it, using
        # Tauri's required "<name>-<target-triple>.exe" sidecar naming.
        run: |
          cargo build --release -p jarvis-app
          New-Item -ItemType Directory -Force -Path crates/jarvis-gui/binaries | Out-Null
          $triple = (rustc -vV | Select-String '^host:\s*(\S+)').Matches[0].Groups[1].Value
          Copy-Item target/release/jarvis-app.exe "crates/jarvis-gui/binaries/jarvis-app-$triple.exe"

      - name: Build Windows installer
        working-directory: crates/jarvis-gui
        shell: pwsh
        run: |
          # frontend/dist was just built above - skip re-running "npm run build"
          # from inside beforeBuildCommand, whose working directory tauri
          # resolves differently depending on where `cargo tauri build` is invoked.
          '{"build":{"beforeBuildCommand":""}}' | Out-File -FilePath ci-override.json -Encoding utf8
          cargo tauri build --config ci-override.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-installer
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
